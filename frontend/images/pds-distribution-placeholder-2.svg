<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5dc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fffacd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGradient2)"/>
  
  <!-- Warehouse/Storage -->
  <rect x="30" y="150" width="500" height="280" fill="#d2b48c" stroke="#333" stroke-width="3"/>
  
  <!-- Roof -->
  <polygon points="30,150 280,50 530,150" fill="#8b6f47" stroke="#333" stroke-width="2"/>
  
  <!-- Shelving Units -->
  <!-- Shelf 1 -->
  <g>
    <line x1="80" y1="200" x2="200" y2="200" stroke="#333" stroke-width="3"/>
    <line x1="80" y1="240" x2="200" y2="240" stroke="#333" stroke-width="3"/>
    <line x1="80" y1="280" x2="200" y2="280" stroke="#333" stroke-width="3"/>
    <line x1="80" y1="320" x2="200" y2="320" stroke="#333" stroke-width="3"/>
    <line x1="80" y1="200" x2="80" y2="340" stroke="#666" stroke-width="2"/>
    <line x1="200" y1="200" x2="200" y2="340" stroke="#666" stroke-width="2"/>
  </g>
  
  <!-- Bags on Shelf 1 -->
  <rect x="85" y="200" width="25" height="35" fill="#cd853f" stroke="#333" stroke-width="1"/>
  <rect x="115" y="200" width="25" height="35" fill="#cd853f" stroke="#333" stroke-width="1"/>
  <rect x="145" y="200" width="25" height="35" fill="#cd853f" stroke="#333" stroke-width="1"/>
  <rect x="175" y="200" width="25" height="35" fill="#cd853f" stroke="#333" stroke-width="1"/>
  
  <rect x="85" y="240" width="25" height="35" fill="#c19a6b" stroke="#333" stroke-width="1"/>
  <rect x="115" y="240" width="25" height="35" fill="#c19a6b" stroke="#333" stroke-width="1"/>
  <rect x="145" y="240" width="25" height="35" fill="#c19a6b" stroke="#333" stroke-width="1"/>
  
  <rect x="85" y="280" width="25" height="35" fill="#daa520" stroke="#333" stroke-width="1"/>
  <rect x="115" y="280" width="25" height="35" fill="#daa520" stroke="#333" stroke-width="1"/>
  
  <!-- Shelf 2 -->
  <g>
    <line x1="250" y1="200" x2="370" y2="200" stroke="#333" stroke-width="3"/>
    <line x1="250" y1="240" x2="370" y2="240" stroke="#333" stroke-width="3"/>
    <line x1="250" y1="280" x2="370" y2="280" stroke="#333" stroke-width="3"/>
    <line x1="250" y1="320" x2="370" y2="320" stroke="#333" stroke-width="3"/>
    <line x1="250" y1="200" x2="250" y2="340" stroke="#666" stroke-width="2"/>
    <line x1="370" y1="200" x2="370" y2="340" stroke="#666" stroke-width="2"/>
  </g>
  
  <!-- Bags on Shelf 2 -->
  <rect x="255" y="200" width="25" height="35" fill="#8b6f47" stroke="#333" stroke-width="1"/>
  <rect x="285" y="200" width="25" height="35" fill="#8b6f47" stroke="#333" stroke-width="1"/>
  <rect x="315" y="200" width="25" height="35" fill="#8b6f47" stroke="#333" stroke-width="1"/>
  <rect x="345" y="200" width="25" height="35" fill="#8b6f47" stroke="#333" stroke-width="1"/>
  
  <rect x="255" y="240" width="25" height="35" fill="#a0826d" stroke="#333" stroke-width="1"/>
  <rect x="285" y="240" width="25" height="35" fill="#a0826d" stroke="#333" stroke-width="1"/>
  <rect x="315" y="240" width="25" height="35" fill="#a0826d" stroke="#333" stroke-width="1"/>
  <rect x="345" y="240" width="25" height="35" fill="#a0826d" stroke="#333" stroke-width="1"/>
  
  <!-- Person checking inventory -->
  <circle cx="430" cy="220" r="15" fill="#f4a460"/>
  <rect x="420" y="240" width="20" height="40" fill="#1c3a70"/>
  <rect x="415" y="245" width="10" height="35" fill="#8b4513"/>
  <rect x="440" y="245" width="10" height="35" fill="#8b4513"/>
  <rect x="415" y="280" width="10" height="30" fill="#333"/>
  <rect x="440" y="280" width="10" height="30" fill="#333"/>
  
  <!-- Clipboard -->
  <rect x="445" y="250" width="30" height="40" fill="#8b4513" stroke="#333" stroke-width="1"/>
  <rect x="448" y="253" width="24" height="34" fill="#fff" stroke="#333" stroke-width="1"/>
  
  <!-- Stock Counter -->
  <g>
    <rect x="570" y="200" width="200" height="100" fill="#fff" stroke="#00bcd4" stroke-width="2" rx="5"/>
    <text x="670" y="230" font-size="18" fill="#1c3a70" text-anchor="middle" font-weight="bold">Stock Inventory</text>
    <text x="670" y="260" font-size="14" fill="#333" text-anchor="middle">Total Bags: 47</text>
    <text x="620" y="285" font-size="12" fill="#666">Rice: 18</text>
    <text x="720" y="285" font-size="12" fill="#666">Wheat: 16</text>
    <text x="620" y="300" font-size="12" fill="#666">Salt: 8</text>
    <text x="720" y="300" font-size="12" fill="#666">Oil: 5</text>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="430" width="800" height="70" fill="#8b7765"/>
  
  <!-- Title -->
  <text x="400" y="40" font-size="32" font-weight="bold" fill="#1c3a70" text-anchor="middle">
    Stock Management & Inventory
  </text>
</svg>
