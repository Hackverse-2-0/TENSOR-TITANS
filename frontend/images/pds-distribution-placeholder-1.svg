<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f6ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGradient)"/>
  
  <!-- Fair Price Shop Building -->
  <rect x="50" y="200" width="300" height="250" fill="#c49457"/>
  <rect x="50" y="200" width="300" height="30" fill="#8b6f47"/>
  <text x="200" y="235" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">FAIR PRICE SHOP</text>
  
  <!-- Windows -->
  <rect x="80" y="100" width="60" height="60" fill="#87ceeb" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="100" x2="110" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="130" x2="140" y2="130" stroke="#333" stroke-width="2"/>
  
  <rect x="240" y="100" width="60" height="60" fill="#87ceeb" stroke="#333" stroke-width="2"/>
  <line x1="270" y1="100" x2="270" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="240" y1="130" x2="300" y2="130" stroke="#333" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="170" y="200" width="60" height="100" fill="#654321" stroke="#333" stroke-width="2"/>
  <circle cx="225" cy="250" r="5" fill="#daa520"/>
  
  <!-- Roof -->
  <polygon points="50,200 200,80 350,200" fill="#a0522d" stroke="#333" stroke-width="2"/>
  
  <!-- People queuing -->
  <!-- Person 1 -->
  <circle cx="380" cy="280" r="15" fill="#f4a460"/>
  <rect x="370" y="300" width="20" height="40" fill="#1c3a70"/>
  <rect x="365" y="305" width="10" height="35" fill="#8b4513"/>
  <rect x="390" y="305" width="10" height="35" fill="#8b4513"/>
  <rect x="365" y="340" width="10" height="30" fill="#333"/>
  <rect x="390" y="340" width="10" height="30" fill="#333"/>
  
  <!-- Person 2 -->
  <circle cx="420" cy="290" r="15" fill="#daa520"/>
  <rect x="410" y="310" width="20" height="40" fill="#228b22"/>
  <rect x="405" y="315" width="10" height="35" fill="#8b4513"/>
  <rect x="430" y="315" width="10" height="35" fill="#8b4513"/>
  <rect x="405" y="350" width="10" height="30" fill="#333"/>
  <rect x="430" y="350" width="10" height="30" fill="#333"/>
  
  <!-- Person 3 -->
  <circle cx="460" cy="285" r="15" fill="#f08080"/>
  <rect x="450" y="305" width="20" height="40" fill="#4169e1"/>
  <rect x="445" y="310" width="10" height="35" fill="#8b4513"/>
  <rect x="470" y="310" width="10" height="35" fill="#8b4513"/>
  <rect x="445" y="345" width="10" height="30" fill="#333"/>
  <rect x="470" y="345" width="10" height="30" fill="#333"/>
  
  <!-- Ration Bags -->
  <g>
    <!-- Bag 1 -->
    <rect x="530" y="280" width="40" height="60" fill="#d2691e" stroke="#333" stroke-width="2" rx="3"/>
    <text x="550" y="310" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">RICE</text>
    
    <!-- Bag 2 -->
    <rect x="580" y="290" width="40" height="60" fill="#8b7355" stroke="#333" stroke-width="2" rx="3"/>
    <text x="600" y="320" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">WHEAT</text>
    
    <!-- Bag 3 -->
    <rect x="630" y="285" width="40" height="60" fill="#daa520" stroke="#333" stroke-width="2" rx="3"/>
    <text x="650" y="315" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">SALT</text>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="450" width="800" height="50" fill="#8b7765"/>
  
  <!-- Title -->
  <text x="400" y="40" font-size="32" font-weight="bold" fill="#1c3a70" text-anchor="middle">
    Ration Distribution Center
  </text>
</svg>
